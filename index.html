<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel-Like Event Table with Mobile Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-lg shadow-inner">
                    <i class="fa-solid fa-table-cells text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Event & Schedule Sheet</h1>
                    <p class="text-xs text-emerald-200">Mobile Responsive • Auto-Sync Enabled</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="loadBtn" class="bg-emerald-800 hover:bg-emerald-900 text-emerald-100 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Reload Cloud
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-4">
        
        <!-- Toolbar & Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <button id="addRowBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-md shadow text-sm flex items-center space-x-2 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Row</span>
                </button>
                <span class="text-xs text-slate-500 italic hidden sm:inline">Tap edit on any item to modify details</span>
            </div>
            <div class="text-xs text-slate-500 flex items-center gap-3 flex-wrap">
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Arranged</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Pending</span>
                <span id="rowCountBadge" class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0 rows</span>
                <span id="syncStatusBadge" class="text-emerald-600 font-semibold flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> Ready</span>
            </div>
        </div>

        <!-- Container -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col">
            
            <!-- DESKTOP VIEW: Standard Table (Hidden on small mobile screens) -->
            <div class="hidden md:block overflow-x-auto flex-grow">
                <table id="excelTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-wider select-none">
                            <th class="py-3 px-4 w-12 text-center border-r border-slate-200">#</th>
                            <th class="py-3 px-4 w-44 border-r border-slate-200">Date <i class="fa-solid fa-arrow-up text-[10px] text-emerald-600 ml-1"></i></th>
                            <th class="py-3 px-4 border-r border-slate-200">Event Description</th>
                            <th class="py-3 px-4 w-44 border-r border-slate-200 text-right">Amount (₹)</th>
                            <th class="py-3 px-4 w-36 border-r border-slate-200">Status</th>
                            <th class="py-3 px-4 w-28 text-center border-r border-slate-200">Indicator</th>
                            <th class="py-3 px-4 w-24 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyDesktop" class="divide-y divide-slate-200 text-sm text-slate-700">
                        <!-- Desktop Rows Injected Here -->
                    </tbody>
                </table>
            </div>

            <!-- MOBILE VIEW: Stacked Card List (Visible only on mobile screens) -->
            <div class="block md:hidden p-4 flex-grow">
                <div id="tableBodyMobile" class="space-y-3">
                    <!-- Mobile Cards Injected Here -->
                </div>
            </div>

            <!-- Table Footer / Total Bar -->
            <div class="bg-slate-50 px-4 py-3 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                    <button id="addBottomRowBtn" class="text-emerald-700 hover:text-emerald-800 text-xs font-semibold flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-circle-plus"></i> Add Row
                    </button>
                    <span class="text-sm font-bold text-slate-700 sm:hidden">Total: <span id="totalAmountMobile" class="text-emerald-700 font-mono">₹0.00</span></span>
                </div>
                <div class="hidden sm:flex items-center gap-2 text-sm font-semibold text-slate-700">
                    <span>Total Amount:</span>
                    <span id="totalAmountDesktop" class="text-emerald-700 font-mono">₹0.00</span>
                </div>
                <div class="text-[11px] text-slate-400">
                    RTDB Connected
                </div>
            </div>
        </div>
    </main>

    <script>
        const RTDB_URL = "https://my-calendar-dc01f-default-rtdb.firebaseio.com/";
        let rowsDataMap = {}; 
        let editingRowId = null; 
        let editingBackup = null; 

        function formatRupee(amount) {
            const num = parseFloat(amount) || 0;
            return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escapeHTML(str) {
            return str ? String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        function getSortedRows() {
            const entries = Object.entries(rowsDataMap);
            entries.sort((a, b) => {
                const dateA = a[1].date || '';
                const dateB = b[1].date || '';
                if (dateA === dateB) return 0;
                if (!dateA) return 1; 
                if (!dateB) return -1;
                return dateA.localeCompare(dateB);
            });
            return entries; 
        }

        function recalculateTotal() {
            let runningTotal = Object.values(rowsDataMap).reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            const formatted = formatRupee(runningTotal);
            document.getElementById('totalAmountDesktop').textContent = formatted;
            document.getElementById('totalAmountMobile').textContent = formatted;
        }

        window.updateCharCounter = function(id) {
            const input = document.getElementById(`edit_event_${id}`);
            const counter = document.getElementById(`char_count_${id}`);
            if (input && counter) {
                counter.textContent = `${input.value.length}/20`;
            }
        }

        function renderTable() {
            const tbodyDesktop = document.getElementById('tableBodyDesktop');
            const tbodyMobile = document.getElementById('tableBodyMobile');
            
            tbodyDesktop.innerHTML = '';
            tbodyMobile.innerHTML = '';

            const sortedEntries = getSortedRows();

            if (sortedEntries.length === 0) {
                const emptyHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <div class="flex flex-col items-center justify-center space-y-2">
                            <i class="fa-solid fa-folder-open text-3xl text-slate-300"></i>
                            <p class="text-sm font-medium">No records found. Click "Add Row" to begin.</p>
                        </div>
                    </div>
                `;
                tbodyDesktop.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-400">No records found.</td></tr>`;
                tbodyMobile.innerHTML = emptyHTML;
                document.getElementById('rowCountBadge').textContent = '0 rows';
                recalculateTotal();
                return;
            }

            sortedEntries.forEach(([id, row], index) => {
                const isArranged = row.status === 'Arranged';
                const statusBadgeClass = isArranged 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                    : 'bg-amber-50 text-amber-700 border-amber-200';
                
                const statusIconHTML = isArranged
                    ? `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 shadow-sm" title="Arranged"><i class="fa-solid fa-check text-xs font-bold"></i></span>`
                    : `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-100 text-amber-600 shadow-sm animate-pulse" title="Pending"><i class="fa-solid fa-clock text-xs"></i></span>`;

                const isEditing = (editingRowId === id);
                const safeEvent = escapeHTML((row.event || '').substring(0, 20));
                const formattedDate = row.date ? new Date(row.date).toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) : 'No date';

                // --- 1. DESKTOP ROW RENDERING ---
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors group';

                if (isEditing) {
                    tr.innerHTML = `
                        <td class="py-2.5 px-4 text-center font-mono text-xs text-slate-400 border-r border-slate-200 bg-slate-50/50">${index + 1}</td>
                        <td class="py-2 px-4 border-r border-slate-200">
                            <input type="date" id="edit_date_d_${id}" value="${row.date || ''}" class="w-full bg-white border border-emerald-500 rounded px-2 py-1.5 text-sm text-slate-700 focus:outline-none">
                        </td>
                        <td class="py-2 px-4 border-r border-slate-200">
                            <div class="relative flex flex-col justify-center">
                                <input type="text" id="edit_event_d_${id}" maxlength="20" value="${safeEvent}" placeholder="Max 20 chars..." oninput="window.syncInputs('${id}', 'event')" class="w-full bg-white border border-emerald-500 rounded px-2 py-1.5 text-sm text-slate-700 focus:outline-none pr-12">
                                <span id="char_count_d_${id}" class="absolute right-2 text-[10px] text-slate-400 font-mono pointer-events-none">${safeEvent.length}/20</span>
                            </div>
                        </td>
                        <td class="py-2 px-4 border-r border-slate-200 text-right">
                            <div class="relative flex items-center">
                                <span class="absolute left-2 text-xs font-semibold text-slate-400">₹</span>
                                <input type="number" step="0.01" id="edit_amount_d_${id}" value="${row.amount ?? 0}" placeholder="0.00" oninput="window.syncInputs('${id}', 'amount')" class="w-full bg-white border border-emerald-500 rounded pl-6 pr-2 py-1.5 text-sm text-slate-700 text-right font-mono focus:outline-none">
                            </div>
                        </td>
                        <td class="py-2 px-4 border-r border-slate-200">
                            <select id="edit_status_d_${id}" onchange="window.syncInputs('${id}', 'status')" class="w-full border rounded-lg px-2.5 py-1.5 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none ${statusBadgeClass}">
                                <option value="Arranged" ${isArranged ? 'selected' : ''}>Arranged</option>
                                <option value="Pending" ${!isArranged ? 'selected' : ''}>Pending</option>
                            </select>
                        </td>
                        <td class="py-2 px-4 text-center border-r border-slate-200">${statusIconHTML}</td>
                        <td class="py-2 px-4 text-center space-x-1">
                            <button onclick="window.saveRowEdit('${id}')" class="text-white bg-emerald-600 hover:bg-emerald-700 p-1.5 rounded-md transition shadow-sm" title="Accept"><i class="fa-solid fa-check text-xs"></i></button>
                            <button onclick="window.cancelRowEdit('${id}')" class="text-white bg-rose-500 hover:bg-rose-600 p-1.5 rounded-md transition shadow-sm" title="Cancel"><i class="fa-solid fa-xmark text-xs"></i></button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td class="py-3 px-4 text-center font-mono text-xs text-slate-400 border-r border-slate-200 bg-slate-50/50">${index + 1}</td>
                        <td class="py-3 px-4 border-r border-slate-200 font-medium">${formattedDate}</td>
                        <td class="py-3 px-4 border-r border-slate-200">${safeEvent || '<span class="text-slate-400 italic">No description</span>'}</td>
                        <td class="py-3 px-4 border-r border-slate-200 text-right font-mono font-medium">${formatRupee(row.amount)}</td>
                        <td class="py-3 px-4 border-r border-slate-200">
                            <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold border ${statusBadgeClass}">${row.status}</span>
                        </td>
                        <td class="py-3 px-4 text-center border-r border-slate-200">${statusIconHTML}</td>
                        <td class="py-3 px-4 text-center space-x-1">
                            <button onclick="window.startRowEdit('${id}')" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded-md hover:bg-emerald-50 transition" title="Edit"><i class="fa-solid fa-pen text-sm"></i></button>
                            <button onclick="window.deleteRowItem('${id}')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-md hover:bg-rose-50 transition" title="Delete"><i class="fa-solid fa-trash-can text-sm"></i></button>
                        </td>
                    `;
                }
                tbodyDesktop.appendChild(tr);

                // --- 2. MOBILE CARD RENDERING ---
                const cardDiv = document.createElement('div');
                cardDiv.className = `p-4 rounded-xl border transition-all shadow-sm ${isEditing ? 'border-emerald-500 bg-emerald-50/20 ring-2 ring-emerald-500/20' : 'border-slate-200 bg-white'}`;

                if (isEditing) {
                    cardDiv.innerHTML = `
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                            <span class="text-xs font-mono font-bold text-slate-400">Record #${index + 1}</span>
                            <div class="flex space-x-1">
                                <button onclick="window.saveRowEdit('${id}')" class="text-white bg-emerald-600 hover:bg-emerald-700 px-3 py-1 rounded text-xs font-semibold transition shadow-sm flex items-center gap-1"><i class="fa-solid fa-check"></i> Save</button>
                                <button onclick="window.cancelRowEdit('${id}')" class="text-white bg-rose-500 hover:bg-rose-600 px-3 py-1 rounded text-xs font-semibold transition shadow-sm flex items-center gap-1"><i class="fa-solid fa-xmark"></i> Cancel</button>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Date</label>
                                <input type="date" id="edit_date_m_${id}" value="${row.date || ''}" class="w-full bg-white border border-emerald-500 rounded p-2 text-sm text-slate-700 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Event Description (Max 20 chars)</label>
                                <div class="relative flex items-center">
                                    <input type="text" id="edit_event_m_${id}" maxlength="20" value="${safeEvent}" placeholder="Event name..." oninput="window.syncInputs('${id}', 'event')" class="w-full bg-white border border-emerald-500 rounded p-2 text-sm text-slate-700 focus:outline-none pr-12">
                                    <span id="char_count_m_${id}" class="absolute right-3 text-[10px] text-slate-400 font-mono pointer-events-none">${safeEvent.length}/20</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Amount (₹)</label>
                                    <div class="relative flex items-center">
                                        <span class="absolute left-2 text-xs font-semibold text-slate-400">₹</span>
                                        <input type="number" step="0.01" id="edit_amount_m_${id}" value="${row.amount ?? 0}" placeholder="0.00" oninput="window.syncInputs('${id}', 'amount')" class="w-full bg-white border border-emerald-500 rounded pl-6 pr-2 p-2 text-sm text-slate-700 text-right font-mono focus:outline-none">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Status</label>
                                    <select id="edit_status_m_${id}" onchange="window.syncInputs('${id}', 'status')" class="w-full border rounded p-2 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none ${statusBadgeClass}">
                                        <option value="Arranged" ${isArranged ? 'selected' : ''}>Arranged</option>
                                        <option value="Pending" ${!isArranged ? 'selected' : ''}>Pending</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    cardDiv.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-mono font-bold text-slate-400 block mb-0.5">#${index + 1} • ${formattedDate}</span>
                                <h3 class="text-base font-semibold text-slate-800">${safeEvent || '<span class="text-slate-400 italic">No description</span>'}</h3>
                            </div>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${statusBadgeClass}">
                                ${row.status}
                            </span>
                        </div>
                        <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                            <div class="flex items-center gap-2">
                                ${statusIconHTML}
                                <span class="text-base font-mono font-bold text-emerald-700">${formatRupee(row.amount)}</span>
                            </div>
                            <div class="space-x-1">
                                <button onclick="window.startRowEdit('${id}')" class="text-slate-500 hover:text-emerald-600 bg-slate-50 hover:bg-emerald-50 p-2 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen text-sm"></i></button>
                                <button onclick="window.deleteRowItem('${id}')" class="text-slate-500 hover:text-rose-600 bg-slate-50 hover:bg-rose-50 p-2 rounded-lg transition" title="Delete"><i class="fa-solid fa-trash-can text-sm"></i></button>
                            </div>
                        </div>
                    `;
                }
                tbodyMobile.appendChild(cardDiv);
            });

            document.getElementById('rowCountBadge').textContent = `${sortedEntries.length} row${sortedEntries.length === 1 ? '' : 's'}`;
            recalculateTotal();
        }

        // Helper to keep desktop and mobile input values synchronized while typing
        window.syncInputs = function(id, field) {
            const valDesktop = document.getElementById(`edit_${field}_d_${id}`);
            const valMobile = document.getElementById(`edit_${field}_m_${id}`);
            
            let currentVal = '';
            if (valDesktop && document.activeElement === valDesktop) {
                currentVal = valDesktop.value;
                if (valMobile) valMobile.value = currentVal;
            } else if (valMobile && document.activeElement === valMobile) {
                currentVal = valMobile.value;
                if (valDesktop) valDesktop.value = currentVal;
            }

            if (field === 'event') {
                const countD = document.getElementById(`char_count_d_${id}`);
                const countM = document.getElementById(`char_count_m_${id}`);
                if (countD) countD.textContent = `${currentVal.length}/20`;
                if (countM) countM.textContent = `${currentVal.length}/20`;
            }
        }

        window.startRowEdit = function(id) {
            editingRowId = id;
            editingBackup = JSON.parse(JSON.stringify(rowsDataMap[id])); 
            renderTable();
        }

        window.saveRowEdit = function(id) {
            // Read from whichever input element is currently available in the DOM
            const dDate = document.getElementById(`edit_date_d_${id}`);
            const mDate = document.getElementById(`edit_date_m_${id}`);
            const dEvent = document.getElementById(`edit_event_d_${id}`);
            const mEvent = document.getElementById(`edit_event_m_${id}`);
            const dAmount = document.getElementById(`edit_amount_d_${id}`);
            const mAmount = document.getElementById(`edit_amount_m_${id}`);
            const dStatus = document.getElementById(`edit_status_d_${id}`);
            const mStatus = document.getElementById(`edit_status_m_${id}`);

            const dateVal = (dDate ? dDate.value : null) || (mDate ? mDate.value : '') || '';
            let eventVal = ((dEvent ? dEvent.value : null) || (mEvent ? mEvent.value : '') || '').substring(0, 20);
            const amountVal = parseFloat((dAmount ? dAmount.value : null) || (mAmount ? mAmount.value : 0) || 0);
            const statusVal = (dStatus ? dStatus.value : null) || (mStatus ? mStatus.value : 'Pending') || 'Pending';

            rowsDataMap[id] = {
                date: dateVal,
                event: eventVal,
                amount: amountVal,
                status: statusVal
            };

            editingRowId = null;
            editingBackup = null;
            renderTable();
            saveToFirebase();
        }

        window.cancelRowEdit = function(id) {
            if (editingBackup) {
                rowsDataMap[id] = editingBackup;
            }
            editingRowId = null;
            editingBackup = null;
            renderTable();
        }

        window.deleteRowItem = function(id) {
            delete rowsDataMap[id];
            renderTable();
            saveToFirebase();
        }

        function addNewRow() {
            const today = new Date().toISOString().split('T')[0];
            const id = 'row_' + Date.now() + Math.random().toString(36).substr(2, 4);
            rowsDataMap[id] = {
                date: today,
                event: '',
                amount: 0.00,
                status: 'Pending'
            };
            
            editingRowId = id;
            editingBackup = { date: today, event: '', amount: 0.00, status: 'Pending' };
            renderTable();
            renderUpdateBadge('New Row Added', 'text-emerald-600');
        }

        function renderUpdateBadge(text, colorClass) {
            const badge = document.getElementById('syncStatusBadge');
            badge.className = `${colorClass} font-semibold flex items-center gap-1`;
            badge.innerHTML = `<i class="fa-solid fa-circle-dot"></i> ${text}`;
        }

        async function loadFromFirebase() {
            renderUpdateBadge('Loading...', 'text-amber-600');
            try {
                const response = await fetch(`${RTDB_URL}/events.json`);
                if (response.ok) {
                    const data = await response.json();
                    if (data) {
                        Object.keys(data).forEach(key => {
                            if (data[key] && data[key].event) {
                                data[key].event = String(data[key].event).substring(0, 20);
                            }
                        });
                    }
                    rowsDataMap = data || {};
                    renderTable();
                    renderUpdateBadge('Synced with Cloud', 'text-emerald-600');
                } else {
                    renderUpdateBadge('Load Failed', 'text-rose-600');
                }
            } catch (err) {
                console.error("Error loading data:", err);
                renderUpdateBadge('Connection Error', 'text-rose-600');
            }
        }

        async function saveToFirebase() {
            renderUpdateBadge('Auto-saving...', 'text-amber-600');
            try {
                const dataToSave = {};
                Object.keys(rowsDataMap).forEach(key => {
                    dataToSave[key] = {
                        ...rowsDataMap[key],
                        event: String(rowsDataMap[key].event || '').substring(0, 20),
                        amount: parseFloat(rowsDataMap[key].amount) || 0
                    };
                });

                const response = await fetch(`${RTDB_URL}/events.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });
                if (response.ok) {
                    renderUpdateBadge('Saved & Synced', 'text-emerald-600');
                } else {
                    renderUpdateBadge('Save Failed', 'text-rose-600');
                }
            } catch (err) {
                console.error("Error saving data:", err);
                renderUpdateBadge('Sync Error', 'text-rose-600');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFromFirebase();
            document.getElementById('addRowBtn').addEventListener('click', addNewRow);
            document.getElementById('addBottomRowBtn').addEventListener('click', addNewRow);
            document.getElementById('loadBtn').addEventListener('click', loadFromFirebase);
        });
    </script>
</body>
</html>
